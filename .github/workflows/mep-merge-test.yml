name: Contrôle de fusion basé sur le label MEP

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

jobs:
  check-mep-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Vérifier les conditions de fusion
        uses: actions/github-script@v6
        with:
          script: |
            const currentPRNumber = context.payload.pull_request.number;
            const currentPRLabels = context.payload.pull_request.labels.map(label => label.name);

            if (currentPRLabels.includes('MEP')) {
              console.log("La PR actuelle a le label 'MEP'. Fusion autorisée.");
              return;
            }

            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const otherMEPPRs = pullRequests.filter(pr =>
              pr.number !== currentPRNumber &&
              pr.labels.some(label => label.name === 'MEP')
            );

            if (otherMEPPRs.length > 0) {
              core.setFailed("Une autre PR avec le label 'MEP' est ouverte. Fusion bloquée pour les PRs sans le label 'MEP'.");
            } else {
              console.log("Aucune autre PR avec le label 'MEP' n'est ouverte. Fusion autorisée.");
            }
