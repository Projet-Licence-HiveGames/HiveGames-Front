name: MEP Merge Test

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

jobs:
  check-label:
    runs-on: ubuntu-latest
    outputs:
      has_mep: ${{ steps.check.outputs.has_mep }}
    steps:
      - name: Check for MEP label
        id: check
        uses: actions/github-script@v6
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name)
            core.setOutput('has_mep', labels.includes('MEP') ? 'true' : 'false')

  ton_job_principal:
    runs-on: ubuntu-latest
    needs: check-label
    if: needs.check-label.outputs.has_mep == 'true'
    steps:
      - name: Faire quelque chose
        run: echo "Le label MEP est présent, on continue !"
