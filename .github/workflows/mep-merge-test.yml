name: Contrôle de fusion basé sur le label MEP

on:
  pull_request:
    types: [opened, reopened, closed, labeled, unlabeled, synchronize]

jobs:
  check-mep-label:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les conditions de fusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Vérifier si la PR actuelle a le label 'MEP'
          has_mep=$(gh pr view "$CURRENT_PR" --repo "$REPO" --json labels --jq '.labels[].name' | grep -c '^MEP$')

          if [ "$has_mep" -eq 1 ]; then
            echo "La PR actuelle a le label 'MEP'. Fusion autorisée."
            exit 0
          fi

          # Rechercher d'autres PRs ouvertes avec le label 'MEP'
          other_mep_prs=$(gh pr list --repo "$REPO" --state open --label "MEP" --json number --jq "[.[] | select(.number != $CURRENT_PR)]")

          if [ "$other_mep_prs" != "[]" ]; then
            echo "Une autre PR avec le label 'MEP' est ouverte. Fusion bloquée pour les PRs sans le label 'MEP'."
            exit 1
          else
            echo "Aucune autre PR avec le label 'MEP' n'est ouverte. Fusion autorisée."
          fi
